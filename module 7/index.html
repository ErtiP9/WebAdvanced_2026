<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 7</title>
</head>
<body>
    
 <label for="firstname">FirstName:</label> <br>
 <input type="text" id="fn" name="fn"> <br>

  <label for="lastname">LastName:</label> <br>
 <input type="text" id="ln" name="ln"><br>

 <label for="">Email:</label><br>
 <input type="email" id="email" name="email"><br>

  <label for="password">Password:</label><br>
 <input type="password" id="password" name="password"><br>

 <label for="gender">Gender:</label><br>

 <input type="radio" id="male" name="gender" value="male">
 <label for="Male">Male</label><br>

  <input type="radio" id="female" name="gender" value="female">
 <label for="female">Female</label><br>

 <label for="hobbies">Hobbies:</label><br>
 <input type="checkbox" id="gaming" name="gaming" value="gaming" >
 <label for="gaming">Gaming</label><br>

  <input type="checkbox" id="swimming" name="swimming" value="swimming" >
 <label for="swimming">Swimming</label><br>

   <input type="checkbox" id="football" name="football" value="football" >
 <label for="football">Football</label><br>


<label for="pet">Choose a pet:</label>
 <select name="pet" id="pet">
       <option value="dog">Dog</option>
       <option value="cat">Cat</option>
       <option value="Parrot">Parrot</option>
 </select><br><br>

 <textarea name="message" id="message" rows="10" cols="20"> </textarea><br>

 <input type="submit" name="submit" id="submit">
</body>
</html>
